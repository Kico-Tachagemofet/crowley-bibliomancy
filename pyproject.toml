[project]
name = "crowley-bibliomancy"
version = "0.1.0"
description = "Local PDF bibliomancy with scene and life-period background cards"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools"]
